<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="disc" cx="42%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#1a1e23" />
      <stop offset="55%" stop-color="#101318" />
      <stop offset="100%" stop-color="#07080a" />
    </radialGradient>
    <linearGradient id="shadowTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.55" />
      <stop offset="45%" stop-color="#000000" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="highlightBottom" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="100%" r="85%">
      <stop offset="0%" stop-color="#C9A46A" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#C9A46A" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="sunFill" cx="42%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#F1D9AA" />
      <stop offset="100%" stop-color="#C9A46A" />
    </radialGradient>
    <clipPath id="discClip">
      <circle cx="512" cy="512" r="300" />
    </clipPath>
    <clipPath id="skyClip">
      <rect x="212" y="212" width="600" height="348" />
    </clipPath>
  </defs>

  <!-- Full-bleed graphite square, no corner radius, no alpha: iOS applies its own mask. -->
  <rect x="0" y="0" width="1024" height="1024" fill="#0B0D10" />

  <!-- Pressed-in circular disc (neumorphic inset), same container language as the original mark. -->
  <circle cx="512" cy="512" r="300" fill="url(#disc)" />
  <g clip-path="url(#discClip)">
    <rect x="212" y="212" width="600" height="600" fill="url(#shadowTop)" />
    <rect x="212" y="212" width="600" height="600" fill="url(#highlightBottom)" />

    <!-- Sun, clipped by the horizon line — the same "sets behind the line" silhouette used by the in-app sun-exit gesture. -->
    <g clip-path="url(#skyClip)">
      <rect x="212" y="212" width="600" height="348" fill="url(#sunGlow)" />
      <circle cx="512" cy="560" r="200" fill="url(#sunFill)" />
    </g>

    <!-- Horizon line. -->
    <rect x="212" y="558" width="600" height="4" fill="#C9A46A" />
  </g>
</svg>
